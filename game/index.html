<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERWATCH — a lantern-keeper's stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a14; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    image-rendering: auto;
    touch-action: none;
    background: #0a0f1e;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="EMBERWATCH: sneak through the moonlit garden, gather the ember keys and slip through the gate unseen"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
